# GoodFolder CI — runs on every push and PR.
#
# Everything here blocks a merge:
#   - Typecheck across every workspace
#   - Vocabulary gate: engine vocabulary must never reach a user-facing surface
#   - Brand SVG validation and contrast check
#   - The site-tools unit test

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck all workspaces
        run: pnpm typecheck

      - name: Vocabulary gate
        run: node tools/vocabulary-gate.mjs

      - name: Brand SVG validation
        run: node tools/validate-brand.mjs

      - name: Contrast check
        run: node tools/check-contrast.mjs

      - name: Unit tests (site tools logic)
        run: node --experimental-transform-types --test apps/web/lib/webmcp.test.ts
