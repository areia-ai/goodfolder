# Publishes @goodfolder/cli and @goodfolder/mcp to npm.
#
# Runs when a v* tag is pushed — the tag is the release, the workflow is the
# delivery — and on demand from the Actions tab.
#
# Authenticates with npm trusted publishing (OIDC): no token is stored
# anywhere. Each package's settings on npmjs.com name this repository and
# this file (publish-npm.yml) as a trusted publisher, and pnpm exchanges the
# job's identity for a short-lived credential. The first release of a new
# package has to be published by hand, because the trusted publisher is
# configured on a package that already exists.

name: publish-npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.22.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Builds both packages, packs them, installs the tarballs into a clean
      # consumer, and runs each executable — a broken package fails here
      # rather than on npm.
      - name: Package smoke test
        run: pnpm package:smoke

      - name: Publish @goodfolder/cli
        run: pnpm --filter @goodfolder/cli publish --no-git-checks --access public

      - name: Publish @goodfolder/mcp
        run: pnpm --filter @goodfolder/mcp publish --no-git-checks --access public
