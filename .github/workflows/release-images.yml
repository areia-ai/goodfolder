# Publishes the prebuilt service images to GHCR.
#
# A pushed v* tag is the release: each image is tagged with the version
# (v1.2.3 -> 1.2.3) and as :latest, for linux/amd64 and linux/arm64.
# `docker compose up -d` in a self-hosted copy pulls these; building from
# source stays available as `docker compose up -d --build`.
#
# The web image is built with the localhost API address baked in
# (NEXT_PUBLIC_API_URL is a build-time value). Anyone serving the dashboard
# on a domain builds that one service locally — see SELF_HOSTING.md.
#
# Manual runs (Actions tab) publish a sha tag only.

name: release-images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: api
            dockerfile: Dockerfile
            image: ghcr.io/areia-ai/goodfolder-api
            build_args: APP=control-plane
          - service: lfs
            dockerfile: Dockerfile
            image: ghcr.io/areia-ai/goodfolder-lfs
            build_args: APP=lfs
          - service: web
            dockerfile: apps/web/Dockerfile
            image: ghcr.io/areia-ai/goodfolder-web
            build_args: ""
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=sha,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: ${{ matrix.build_args }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
