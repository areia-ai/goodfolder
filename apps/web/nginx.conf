# Serves the static export in apps/web/out. Mirrors what
# apps/web/public/_headers and _redirects do on Cloudflare Pages:
#   /docs.md     -> text/markdown, canonical </docs>
#   /llms.txt    -> text/plain
#   /dashboard*  -> noindex
#   /challenge*  -> noindex, and /challenge itself forwards to the demo
# The export writes <name>.html files, so extensionless paths resolve through
# try_files; query strings never reach the filesystem lookup.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css text/markdown application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    location = /challenge {
        absolute_redirect off;
        add_header X-Robots-Tag "noindex, nofollow";
        return 302 /dashboard?demo=1;
    }

    location ~ ^/(dashboard|challenge) {
        add_header X-Robots-Tag "noindex, nofollow";
        try_files $uri $uri.html =404;
    }

    location = /docs.md {
        default_type "text/markdown; charset=utf-8";
        add_header Link '</docs>; rel="canonical"';
    }

    location = /llms.txt {
        default_type "text/plain; charset=utf-8";
    }

    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }
}
