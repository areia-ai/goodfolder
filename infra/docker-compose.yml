name: goodfolder

# Every service is memory-capped: this stack is expected to share a host with
# other workloads. Total cap ≈ 1.1 GB.
# Nothing publishes to 0.0.0.0. Loopback-only ports are for local debugging;
# Gitea publishes nothing at all.

services:
  goodfolder-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gitea
      POSTGRES_PASSWORD: ${GITEA_DB_PASSWORD}
      POSTGRES_DB: gitea
      GOODFOLDER_DB_PASSWORD: ${GOODFOLDER_DB_PASSWORD}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/10-goodfolder.sh:ro
    ports:
      - "127.0.0.1:5433:5432"
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitea -d gitea"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [goodfolder-net]

  goodfolder-minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --address :9000
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY}
    volumes:
      - ./data/minio:/data
    ports:
      - "127.0.0.1:9100:9000"
    mem_limit: 256m
    networks: [goodfolder-net]

  goodfolder-gitea:
    image: gitea/gitea:1.26
    restart: unless-stopped
    # Transport only: LFS off, SSH off, registration off, never published.
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      GITEA__server__DOMAIN: goodfolder-gitea
      GITEA__server__HTTP_ADDR: 0.0.0.0
      GITEA__server__HTTP_PORT: "3000"
      GITEA__server__ROOT_URL: http://goodfolder-gitea:3000/
      GITEA__server__DISABLE_SSH: "true"
      GITEA__server__OFFLINE_MODE: "true"
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: goodfolder-postgres:5432
      GITEA__database__NAME: gitea
      GITEA__database__USER: gitea
      GITEA__database__PASSWD: ${GITEA_DB_PASSWORD}
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__security__SECRET_KEY: ${GITEA_SECRET_KEY}
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__service__SHOW_REGISTRATION_BUTTON: "false"
      GITEA__lfs__ENABLED: "false"
      GITEA__log__LEVEL: Info
    volumes:
      - ./data/gitea:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    # DEV ONLY: loopback publish for SSH-tunneled development. Loopback-bound
    # ports are not internet-reachable; remove before public beta.
    ports:
      - "127.0.0.1:4102:3000"
    depends_on:
      goodfolder-postgres:
        condition: service_healthy
    mem_limit: 320m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:3000/api/healthz"]
      interval: 15s
      timeout: 5s
      retries: 20
    networks: [goodfolder-net]

  goodfolder-api:
    build:
      context: ./apps/control-plane
      dockerfile: ../../Dockerfile.app
    restart: unless-stopped
    environment:
      PORT: "4100"
      DATABASE_URL: postgres://goodfolder:${GOODFOLDER_DB_PASSWORD}@goodfolder-postgres:5432/goodfolder
      GITEA_INTERNAL_URL: http://goodfolder-gitea:3000
      GITEA_ADMIN_USER: gf-service
      GITEA_ADMIN_PASSWORD: ${GITEA_ADMIN_PASSWORD}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: auto
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET:-goodfolder-dev}
      PUBLIC_LFS_ORIGIN: https://api.trygoodfolder.com
      LFS_INTERNAL_URL: http://goodfolder-lfs:4101
      PRESIGN: "1"
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      LABEL_MODEL: ${LABEL_MODEL}
      WEB_ORIGINS: ${WEB_ORIGINS}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-GoodFolder <contact@trygoodfolder.com>}
      DEV_API_KEY: ${DEV_API_KEY}
      WAITLIST_DAILY_CAP: ${WAITLIST_DAILY_CAP:-200}
    ports:
      - "127.0.0.1:4100:4100"
    depends_on:
      goodfolder-postgres:
        condition: service_healthy
      goodfolder-gitea:
        condition: service_healthy
    mem_limit: 192m
    networks: [goodfolder-net]

  goodfolder-lfs:
    build:
      context: ./apps/lfs
      dockerfile: ../../Dockerfile.app
    restart: unless-stopped
    environment:
      PORT: "4101"
      DATABASE_URL: postgres://goodfolder:${GOODFOLDER_DB_PASSWORD}@goodfolder-postgres:5432/goodfolder
      GITEA_INTERNAL_URL: http://goodfolder-gitea:3000
      GITEA_ADMIN_USER: gf-service
      GITEA_ADMIN_PASSWORD: ${GITEA_ADMIN_PASSWORD}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: auto
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET:-goodfolder-dev}
      PUBLIC_LFS_ORIGIN: https://api.trygoodfolder.com
      PRESIGN: "1"
    ports:
      - "127.0.0.1:4101:4101"
    depends_on:
      goodfolder-postgres:
        condition: service_healthy
      goodfolder-minio:
        condition: service_started
    mem_limit: 160m
    networks: [goodfolder-net]

networks:
  goodfolder-net:
    driver: bridge
