packages:
  - apps/*
  - packages/*
allowBuilds:
  core-js: true
  esbuild: true
  sharp: false
overrides:
  # Next pins postcss 8.4.31, which carries the source-map path traversal
  # and </style> escaping advisories. Only the build reads it; keep it patched.
  "postcss@<8.5.23": 8.5.26
  # ajv (via @modelcontextprotocol/sdk) pulls fast-uri <3.1.6, which carries
  # the host-confusion advisory. 3.1.6+ is patched; stay on 3.x.
  "fast-uri": "^3.1.8"
  # express (via @modelcontextprotocol/sdk) resolves proxy-addr 2.0.7, which
  # carries the IPv4-mapped trust-subnet advisory; ^2.0.7 allows the patch.
  "proxy-addr": "^2.0.8"
  # express-rate-limit (via @modelcontextprotocol/sdk) pins ip-address <10.7.1,
  # which carries four classifier advisories; ^10.2.0 allows the patch.
  "ip-address": "^10.7.3"
  # body-parser (via express) pins qs <6.16.0, which carries two advisories;
  # ^6.15.2 allows the patch.
  "qs": "^6.16.0"
  # postcss/tailwind pin source-map-js <1.2.2 (event-loop DoS); ^1.2.1 allows
  # the patch. Build-time only.
  "source-map-js": "^1.2.2"
  # posthog-js pins dompurify <3.4.16 (two XSS advisories); ^3.4.13 allows the
  # patch.
  "dompurify": "^3.4.16"
  # next's optional sharp (unused with output:"export") pins <0.35.5, which
  # carries a librsvg advisory; the patch is in-range.
  "sharp": "^0.35.5"
